name: CI

on:
  pull_request:
    branches:
      - codex/workbuddy-shell-v2
  push:
    branches:
      - codex/workbuddy-shell-v2

permissions:
  contents: read

jobs:
  test:
    name: Shell contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Shell contract tests
        run: python -m pytest -p no:cacheprovider tests/workbuddy/test_package_registration.py tests/workbuddy/test_runtime_prepare.py tests/workbuddy/test_session_launcher.py tests/workbuddy/test_repository_hygiene.py -q
