name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # W0 compares the published snapshot with its pinned public baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run WorkBuddy W1 gate
        # Public CI validates the published snapshot and must not require access
        # to the private Golden Key Core source repository or its Release assets.
        run: |
          python -m golden_key_openmontage_workbuddy gate \
            --repo-root . \
            --data-root "$RUNNER_TEMP/WorkBuddyData" \
            --json

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test
