name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Verify locked WorkBuddy Core release and idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/core_sync/sync_workbuddy_core.py sync-release \
            --asset-dir "$RUNNER_TEMP/golden-key-workbuddy-core/golden-key-v0.3.21" \
            --config config/openmontage.sync.json \
            --destination . \
            --report "$RUNNER_TEMP/workbuddy-core-sync-report.json"
          git diff --exit-code

      - name: Run WorkBuddy W1 gate
        run: |
          python -m golden_key_openmontage_workbuddy gate \
            --repo-root . \
            --data-root "$RUNNER_TEMP/WorkBuddyData" \
            --json

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test
