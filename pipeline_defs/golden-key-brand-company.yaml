name: golden-key-brand-company
version: "0.2.4"
description: >
  Brand and company communication pipeline for building verified recognition,
  meaning, trust, or reputation around an organization. It turns an approved brand
  thesis and real company evidence into a memorable emotional and factual narrative.
  People, places, processes, identity assets, narration, graphics, and generated
  support are selected only when they serve the brand promise without fabricating
  company history, scale, capability, culture, customers, or results.
category: custom
stability: beta
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_depth: deep
  analysis_tools:
    - video_analyzer
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

orchestration:
  mode: executive-producer
  skill: pipelines/golden-key-brand-company/executive-producer
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 15

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/golden-key-brand-company/executive-producer
  - pipelines/golden-key-brand-company/director-decision-policy
  - pipelines/golden-key-brand-company/reviewer-rubric
  - pipelines/golden-key-brand-company/idea-director
  - pipelines/golden-key-brand-company/proposal-director
  - pipelines/golden-key-brand-company/script-director
  - pipelines/golden-key-brand-company/scene-director
  - pipelines/golden-key-brand-company/asset-director
  - pipelines/golden-key-brand-company/edit-director
  - pipelines/golden-key-brand-company/compose-director
  - pipelines/golden-key-brand-company/publish-director
  - meta/text-layer-direction
  - meta/taste-direction
  - meta/voice-performance-director
  - meta/animation-runtime-selector
  - meta/bespoke-composition
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/video-reference-analyst
  - meta/material-retrieval-boundary

compatible_playbooks:
  recommended:
    - premium-minimalist
    - clean-professional
  also_works:
    - flat-motion-graphics
  custom_allowed: true

metadata:
  primary_goal: brand_company_recognition_and_trust
  supported_communication_objects:
    - brand_identity
    - company_profile
    - organizational_values
    - employer_brand
    - reputation_theme
  canonical_artifact_policy: openmontage_only
  platform_profile_transport: agent_input_reference
  project_content_context_transport: agent_input_reference
  project_content_context_policy: frozen_selected_sources_only
  required_decision_fields:
    - communication_object
    - brand_thesis
    - desired_association
    - verified_company_facts
    - brand_evidence_map
    - narrative_driver
    - identity_system
    - presenter_mode
    - visual_sources
    - layout_strategy
    - text_layer_direction
    - audio_treatment
    - source_support_policy
    - image_to_video_plan
    - platform_profile_ref
    - project_content_context_ref
    - context_evidence_map
    - execution_requirements
    - review_obligations
  approval_actor_mapping:
    idea_direction: customer
    proposal_direction: customer
    proposal_technical: internal_operator
    script: internal_operator
    scene_plan: internal_operator
    assets: internal_operator
    edit: system_validator
    compose: system_validator
    publish: customer

stages:
  - name: idea
    skill: pipelines/golden-key-brand-company/idea-director
    optional_artifacts_in: [source_media_review, video_analysis_brief]
    produces: [brief, decision_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Primary outcome is verified brand or company recognition, meaning, trust, or reputation rather than product sale, subject affinity, or direct lead capture
      - Fact-only CustomerFactSet inputs make verified company facts, user-stated desired association, identity facts, rights, and unknowns explicit without pre-authoring a brand thesis
      - PlatformProfile shapes the hook, emotional value, proof style, pacing, audio, text, and review
      - Material-library intake is task-independent; full snapshot plus unranked initial coverage expose evidence without preselecting a thesis, concept, or shot
      - ProjectContentContext company documents, identity assets, images, permissions, expiry, conflicts, prohibited expressions, and gaps are resolved with exact anchors; benchmark fixtures remain labeled benchmark-only
    success_criteria:
      - Schema-valid brief and decision_log
      - Brief metadata contains CustomerFactSet, PlatformProfile, material-query, identity-system facts, truth-boundary, and pending proposal capability-audit references; the brand thesis is OpenMontage-owned

  - name: proposal
    skill: pipelines/golden-key-brand-company/proposal-director
    required_artifacts_in: [brief]
    optional_artifacts_in: [source_media_review, video_analysis_brief]
    produces: [proposal_packet, decision_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - At least three concepts express genuinely different brand narratives rather than cosmetic visual variants
      - The creative winner is selected before OpenMontage authors any concept-specific material query
      - Every concept's brand-evidence chain cites eligible ProjectContentContext anchors and excludes expired, conflicting, prohibited, private-for-public-use, or cross-project evidence
      - Each concept connects an emotional or factual thesis to nearby verified company evidence
      - Brand identity, audio motif, text roles, support layers, runtime, composition mode, capability status, cost, and fallback are resolved
      - Generated content never stands in for real history, facilities, staff, culture, customer experience, scale, or performance
    success_criteria:
      - Schema-valid proposal_packet and decision_log
      - Selected concept, brand-evidence chain, production path, audio motif, text roles, cost, and approvals are explicit
    sub_stages:
      - name: sample
        description: "10-15 second sample for reference-driven, paid, identity-sensitive, or brand-preservation-sensitive work"
        condition: "video_analysis_brief_exists"
        human_approval_default: true
        tools_available: [talking_head, lip_sync, tts_selector, image_selector, video_selector, subtitle_gen, video_compose, audio_mixer]
        review_focus:
          - "Sample proves the selected brand treatment without copying the reference"
          - "Logo, typography, color, people, premises, products, and company facts remain accurate"
          - "Pacing, captions, music motif, voice, and ending fit the approved PlatformProfile and brand thesis"

  - name: script
    skill: pipelines/golden-key-brand-company/script-director
    required_artifacts_in: [brief, proposal_packet]
    optional_artifacts_in: [source_media_review]
    produces: [script]
    optional_tools: [transcriber, scene_detect]
    tools_available: [transcriber, scene_detect]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook establishes the desired association or company question without vague corporate slogans
      - One primary viewer payoff and at most one secondary payoff connect the opening relevance, company proof, thesis, and complete ending
      - Every company statement is a verified fact, supported interpretation, or clearly subjective brand invitation
      - Every material-backed company fact, quotation, identity rule, visible text, or visual obligation cites the exact ProjectContentContext evidence and source anchor
      - Human voice, narration, captions, natural sound, music motif, and brand line form one finished story
    success_criteria:
      - Schema-valid complete script
      - Every section records brand function, fact/evidence basis, audio carrier, and intended audience response

  - name: scene_plan
    skill: pipelines/golden-key-brand-company/scene-director
    required_artifacts_in: [script, brief, proposal_packet]
    optional_artifacts_in: [source_media_review]
    produces: [scene_plan]
    optional_tools: [frame_sampler, scene_detect, face_tracker]
    tools_available: [frame_sampler, scene_detect, face_tracker]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Brand thesis and real company evidence are visible at the moments where the script asks for trust or recall
      - Every source shot records source_path, source kind, exact multimodal anchor, narrative role, identity treatment, and fallback; temporal shots also record source_in/source_out/speed
      - Temporal shots use exact ranges; still images and documents use exact region/page/table anchors, display duration, public-use permission, and legibility/redaction checks
      - Generated or graphic support solves a named communication gap and is never presented as real company evidence
      - First frame, brand codes, safe zones, text, pacing, and landing frame follow the PlatformProfile
    success_criteria:
      - Schema-valid scene_plan
      - metadata shot plan covers the full duration with exact source lineage or explicit generated/support designation
      - Every source row passes temporal range/speed arithmetic or still/document display-duration arithmetic

  - name: assets
    skill: pipelines/golden-key-brand-company/asset-director
    required_artifacts_in: [scene_plan, proposal_packet]
    optional_artifacts_in: [script, brief, source_media_review]
    produces: [asset_manifest]
    optional_tools: [subtitle_gen, talking_head, lip_sync, tts_selector, image_selector, video_selector, pixabay_music, freesound_music, music_gen, audio_enhance]
    tools_available: [subtitle_gen, talking_head, lip_sync, tts_selector, image_selector, video_selector, pixabay_music, freesound_music, music_gen, audio_enhance]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every asset has provenance, rights, brand role, identity constraints, and relation to a planned scene
      - Generated assets include prompt, negative prompt, references, protected brand elements, disclosure, sample gate, acceptance, and fallback
      - Narration/source speech, captions, music motif, natural sound, and brand graphics match the approved treatment
    success_criteria:
      - Schema-valid asset_manifest
      - Existing assets resolve to exact source ranges and synthetic support remains unmistakably separate from company evidence

  - name: edit
    skill: pipelines/golden-key-brand-company/edit-director
    required_artifacts_in: [scene_plan, asset_manifest, proposal_packet]
    optional_artifacts_in: [script, brief]
    produces: [edit_decisions]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Source-led anchor cut communicates the selected brand thesis before decorative support is added
      - Emotional arc, company proof, identity cadence, audio motif, text roles, and brand-memory ending remain coherent
      - Overlays and transitions do not obscure real people, facilities, process, products, or evidence
      - metadata.text_layer_direction is semantically valid
      - The ending lands on a deliberate brand memory device with readable and audible clearance
    success_criteria:
      - Schema-valid edit_decisions
      - Every cut has exact in/out points and reason, and the runtime matches the approved proposal
      - metadata.text_layer_direction passes the native semantic validator

  - name: compose
    skill: pipelines/golden-key-brand-company/compose-director
    required_artifacts_in: [edit_decisions, asset_manifest, proposal_packet]
    optional_artifacts_in: [scene_plan, script, brief]
    produces: [render_report, final_review]
    required_tools: [video_compose, audio_mixer]
    optional_tools: [remotion_caption_burn, video_stitch, video_trimmer, color_grade, audio_enhance, visual_qa]
    tools_available: [video_compose, remotion_caption_burn, hyperframes_compose, audio_mixer, video_stitch, video_trimmer, color_grade, audio_enhance, visual_qa]
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Runtime, providers, voice, music, identity treatment, and support layers match approved artifacts without silent substitution
      - Logo, typography, color, people, premises, product, company facts, and evidence remain accurate
      - Finished audio, text hierarchy, brand distinctness, platform fit, technical QA, and disclosure pass
      - Dedicated last-second evidence proves the brand-memory ending is intentional rather than truncated
    success_criteria:
      - Schema-valid render_report and final_review
      - Output passes ffprobe/decode and records company-evidence, brand-preservation, audio, text, ending, and disclosure QA

  - name: publish
    skill: pipelines/golden-key-brand-company/publish-director
    required_artifacts_in: [render_report, final_review]
    optional_artifacts_in: [brief, proposal_packet, script]
    produces: [publish_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Title, cover, copy, tags, brand line, soft next step, and disclosure match the selected PlatformProfile and actual video
      - Packaging adds no unsupported history, scale, capability, culture, customer, credential, location, award, or result claim
      - Title value, one-focus cover, evidence-bounded copy, relevant tags, and at most one response action match the actual piece
    success_criteria:
      - Schema-valid publish_log
      - Export package contains approved video, cover guidance, platform copy, brand/rights provenance, and disclosure notes
