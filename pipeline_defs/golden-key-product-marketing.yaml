name: golden-key-product-marketing
version: "0.4.4"
description: >
  Product and service marketing pipeline for awareness, consideration, trial, or
  purchase. It converts verified product or service facts into viewer benefits and
  nearby evidence. Real customer media, approved product assets, demonstrations, and
  service-process footage remain factual anchors. Narration, graphics, I2V, presenters,
  and generated support are selected only when they solve a named communication or
  production problem.
category: custom
stability: beta
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_depth: deep
  analysis_tools:
    - video_analyzer
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

orchestration:
  mode: executive-producer
  skill: pipelines/golden-key-product-marketing/executive-producer
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 15

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/golden-key-product-marketing/executive-producer
  - pipelines/golden-key-product-marketing/director-decision-policy
  - pipelines/golden-key-product-marketing/reviewer-rubric
  - pipelines/golden-key-product-marketing/idea-director
  - pipelines/golden-key-product-marketing/proposal-director
  - pipelines/golden-key-product-marketing/script-director
  - pipelines/golden-key-product-marketing/scene-director
  - pipelines/golden-key-product-marketing/asset-director
  - pipelines/golden-key-product-marketing/edit-director
  - pipelines/golden-key-product-marketing/compose-director
  - pipelines/golden-key-product-marketing/publish-director
  - meta/text-layer-direction
  - meta/taste-direction
  - meta/voice-performance-director
  - meta/animation-runtime-selector
  - meta/bespoke-composition
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/video-reference-analyst
  - meta/material-retrieval-boundary

compatible_playbooks:
  recommended:
    - clean-professional
    - premium-minimalist
  also_works:
    - flat-motion-graphics
  custom_allowed: true

metadata:
  primary_goal: product_or_service_interest
  supported_marketed_objects:
    - physical_product
    - digital_product
    - service
    - packaged_offer
  canonical_artifact_policy: openmontage_only
  platform_profile_transport: agent_input_reference
  project_content_context_transport: agent_input_reference
  project_content_context_policy: frozen_selected_sources_only
  required_decision_fields:
    - marketed_object
    - audience_problem_or_desire
    - value_proposition
    - claim_evidence_map
    - narrative_driver
    - presenter_mode
    - visual_sources
    - layout_strategy
    - text_layer_direction
    - audio_treatment
    - source_support_policy
    - image_to_video_plan
    - platform_profile_ref
    - project_content_context_ref
    - context_evidence_map
    - execution_requirements
    - review_obligations
  approval_actor_mapping:
    idea_direction: customer
    proposal_direction: customer
    proposal_technical: internal_operator
    script: internal_operator
    scene_plan: internal_operator
    assets: internal_operator
    edit: system_validator
    compose: system_validator
    publish: customer

stages:
  - name: idea
    skill: pipelines/golden-key-product-marketing/idea-director
    optional_artifacts_in: [source_media_review, video_analysis_brief]
    produces: [brief, decision_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Primary outcome is awareness, consideration, trial, or purchase of a verified product or service
      - Fact-only CustomerFactSet inputs make marketed-object facts, audience, rights, user-requested action, and unknowns explicit without pre-authoring the value proposition
      - PlatformProfile shapes the promise, hook, proof style, pacing, audio, text, and review
      - Material-library intake is task-independent; full snapshot plus unranked initial coverage expose evidence without preselecting a concept or shot
      - ProjectContentContext contributes only eligible cited document facts, excerpts, image observations, permissions, expiry, conflicts, prohibitions, and gaps; an empty context triggers no library retrieval
    success_criteria:
      - Schema-valid brief and decision_log
      - Brief metadata contains CustomerFactSet, PlatformProfile, material-query, truth-boundary, and pending proposal capability-audit references; value proposition and treatment are OpenMontage decisions

  - name: proposal
    skill: pipelines/golden-key-product-marketing/proposal-director
    required_artifacts_in: [brief]
    optional_artifacts_in: [source_media_review, video_analysis_brief]
    produces: [proposal_packet, decision_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - At least three concepts are structurally different and not cosmetic variants
      - The creative winner is selected before OpenMontage authors any concept-specific material query
      - Every concept's fact-benefit-evidence chain cites eligible ProjectContentContext anchors and excludes expired, conflicting, prohibited, or cross-project evidence
      - Product or service benefit is supported by nearby evidence rather than invented persuasion
      - Audio, text roles, support layers, render runtime, composition mode, capability status, cost, and fallbacks are resolved
      - I2V or enhancement is selected only for a named need and may be explicitly rejected
    success_criteria:
      - Schema-valid proposal_packet and decision_log
      - Selected concept, comparison, production path, audio plan, text roles, cost, and approvals are explicit
    sub_stages:
      - name: sample
        description: "10-15 second sample for reference-driven, paid, identity-sensitive, or product-preservation-sensitive work"
        condition: "video_analysis_brief_exists"
        human_approval_default: true
        tools_available: [talking_head, lip_sync, tts_selector, image_selector, video_selector, subtitle_gen, video_compose, audio_mixer]
        review_focus:
          - "Sample proves the selected product/service treatment without copying the reference"
          - "Product, service process, people, text, logo, color, and factual claims remain accurate"
          - "Pacing, captions, music, and voice fit the approved PlatformProfile"

  - name: script
    skill: pipelines/golden-key-product-marketing/script-director
    required_artifacts_in: [brief, proposal_packet]
    optional_artifacts_in: [source_media_review]
    produces: [script]
    optional_tools: [transcriber, scene_detect]
    tools_available: [transcriber, scene_detect]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook identifies a real audience situation and the marketed service/product early
      - One primary viewer payoff and at most one secondary payoff connect the opening promise, product evidence, suspense payoff, and complete ending
      - Every claim follows fact to benefit to evidence or is clearly framed as an invitation or impression
      - Every material-backed claim, quotation, price, parameter, visible text, or visual obligation cites the exact ProjectContentContext evidence and source anchor
      - Voice, captions, natural sound, music, and CTA form a finished script rather than an ad-shaped placeholder
    success_criteria:
      - Schema-valid complete script
      - Every section records claim basis, evidence/source role, audio carrier, and intended viewer response

  - name: scene_plan
    skill: pipelines/golden-key-product-marketing/scene-director
    required_artifacts_in: [script, brief, proposal_packet]
    optional_artifacts_in: [source_media_review]
    produces: [scene_plan]
    optional_tools: [frame_sampler, scene_detect, face_tracker]
    tools_available: [frame_sampler, scene_detect, face_tracker]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Product/service and proof are visible at the moments where the script makes promises
      - Every source shot records source_path, source kind, exact multimodal anchor, task role, and fallback; temporal shots also record source_in/source_out/speed
      - Temporal shots use exact ranges; still images and documents use exact region/page/table anchors, display duration, public-use permission, and legibility/redaction checks
      - Generated or graphic support solves named gaps and is never used as real proof
      - First frame, safe zones, text, pacing, and CTA follow applied PlatformProfile rules
    success_criteria:
      - Schema-valid scene_plan
      - metadata shot plan covers full duration with source lineage or explicit generated/support designation
      - Every source row passes temporal range/speed arithmetic or still/document display-duration arithmetic

  - name: assets
    skill: pipelines/golden-key-product-marketing/asset-director
    required_artifacts_in: [scene_plan, proposal_packet]
    optional_artifacts_in: [script, brief, source_media_review]
    produces: [asset_manifest]
    optional_tools: [subtitle_gen, talking_head, lip_sync, tts_selector, image_selector, video_selector, pixabay_music, freesound_music, music_gen, audio_enhance]
    tools_available: [subtitle_gen, talking_head, lip_sync, tts_selector, image_selector, video_selector, pixabay_music, freesound_music, music_gen, audio_enhance]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every asset has provenance, task role, rights, and relation to a planned shot
      - Generated assets include prompt, negative prompt, reference frame, protected elements, sample gate, acceptance, and fallback
      - Narration/source speech, captions, music, and natural sound match the approved audio architecture
    success_criteria:
      - Schema-valid asset_manifest
      - Planned existing assets resolve to exact source ranges and generated assets remain clearly distinguished

  - name: edit
    skill: pipelines/golden-key-product-marketing/edit-director
    required_artifacts_in: [scene_plan, asset_manifest, proposal_packet]
    optional_artifacts_in: [script, brief]
    produces: [edit_decisions]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Source-led anchor cut communicates the selected promise before support layers are added
      - Exact cuts, benefit-proof adjacency, pacing, audio mix, text roles, and CTA intensity remain coherent
      - Overlays and transitions do not obscure product/service evidence or turn atmosphere into a factual claim
      - metadata.text_layer_direction is semantically valid
      - The ending has an explicit landing frame, readable text clearance, visual release, and audio tail
    success_criteria:
      - Schema-valid edit_decisions
      - Every cut has exact in/out points and reason, and the full runtime matches the approved proposal
      - metadata.text_layer_direction passes the native semantic validator

  - name: compose
    skill: pipelines/golden-key-product-marketing/compose-director
    required_artifacts_in: [edit_decisions, asset_manifest, proposal_packet]
    optional_artifacts_in: [scene_plan, script, brief]
    produces: [render_report, final_review]
    required_tools: [video_compose, audio_mixer]
    optional_tools: [remotion_caption_burn, video_stitch, video_trimmer, color_grade, audio_enhance, visual_qa]
    tools_available: [video_compose, remotion_caption_burn, hyperframes_compose, audio_mixer, video_stitch, video_trimmer, color_grade, audio_enhance, visual_qa]
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Runtime, providers, voice, music, claims, and support layers match approved artifacts without silent substitution
      - Product appearance, service process, people, logo, text, and evidence remain accurate
      - Finished audio, text hierarchy, platform fit, technical QA, and generated-content disclosure pass
      - Dedicated last-second temporal evidence proves the ending is intentional rather than truncated
    success_criteria:
      - Schema-valid render_report and final_review
      - Output passes ffprobe/decode and records evidence, product-preservation, audio, text, and disclosure QA

  - name: publish
    skill: pipelines/golden-key-product-marketing/publish-director
    required_artifacts_in: [render_report, final_review]
    optional_artifacts_in: [brief, proposal_packet, script]
    produces: [publish_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Title, cover, copy, tags, CTA, and disclosure match the selected PlatformProfile and actual video
      - No price, offer, review, effect, location, scarcity, or credential is added without evidence
      - Title pain/value, one-focus cover, evidence-bounded copy, relevant tags, and at most one approved funnel action match the actual video
    success_criteria:
      - Schema-valid publish_log
      - Export package contains approved video, cover guidance, platform copy, provenance, and disclosure notes
