name: golden-key-subject-ip
version: "0.6.4"
description: >
  Subject-led short-video pipeline for building recognition, affection, trust, or
  identification around a recurring person, animal, virtual character, or mascot.
  Real source media is the evidence base for real people and animals; approved design,
  rig, and lore assets are the identity truth for virtual characters and mascots.
  Narration, captions, music, graphics, and generated inserts are selected only when
  they solve a named story, comprehension, platform, or continuity need.
category: custom
stability: beta
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_depth: deep
  analysis_tools:
    - video_analyzer
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

orchestration:
  mode: executive-producer
  skill: pipelines/golden-key-subject-ip/executive-producer
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 15

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/golden-key-subject-ip/executive-producer
  - pipelines/golden-key-subject-ip/director-decision-policy
  - pipelines/golden-key-subject-ip/reviewer-rubric
  - pipelines/golden-key-subject-ip/idea-director
  - pipelines/golden-key-subject-ip/proposal-director
  - pipelines/golden-key-subject-ip/script-director
  - pipelines/golden-key-subject-ip/scene-director
  - pipelines/golden-key-subject-ip/asset-director
  - pipelines/golden-key-subject-ip/edit-director
  - pipelines/golden-key-subject-ip/compose-director
  - pipelines/golden-key-subject-ip/publish-director
  - meta/text-layer-direction
  - meta/taste-direction
  - meta/voice-performance-director
  - meta/animation-runtime-selector
  - meta/bespoke-composition
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/video-reference-analyst
  - meta/material-retrieval-boundary

compatible_playbooks:
  recommended:
    - flat-motion-graphics
    - clean-professional
  also_works:
    - premium-minimalist
  custom_allowed: true

metadata:
  primary_goal: subject_affinity
  supported_subject_types:
    - person
    - animal
    - virtual_character
    - mascot
  canonical_artifact_policy: openmontage_only
  platform_profile_transport: agent_input_reference
  project_content_context_transport: agent_input_reference
  project_content_context_policy: frozen_selected_sources_only
  required_decision_fields:
    - episode_role
    - narrative_driver
    - presenter_mode
    - visual_sources
    - layout_strategy
    - text_layer_direction
    - audio_treatment
    - source_support_policy
    - image_to_video_plan
    - platform_profile_ref
    - project_content_context_ref
    - context_evidence_map
    - execution_requirements
    - review_obligations
  approval_actor_mapping:
    idea_direction: customer
    proposal_direction: customer
    proposal_technical: internal_operator
    script: internal_operator
    scene_plan: internal_operator
    assets: internal_operator
    edit: system_validator
    compose: system_validator
    publish: customer

stages:
  - name: idea
    skill: pipelines/golden-key-subject-ip/idea-director
    optional_artifacts_in:
      - source_media_review
      - video_analysis_brief
    produces:
      - brief
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Primary goal is subject recognition, affection, trust, or identification rather than product sales, company proof, or lead capture
      - Versioned fact-only subject_facts_profile_ref, subject type, verified facts, rights, identity anchors, and interpretation boundaries are explicit
      - PlatformProfile influences hook, emotional value, pacing, visual treatment, audio, and review rather than only export settings
      - Full MaterialIndexSnapshot and unranked initial coverage inform evidence limits without preselecting a concept or shot
      - ProjectContentContext document facts, excerpts, image observations, permissions, expiry, conflicts, prohibitions, and gaps are resolved with exact anchors and do not pre-author creative treatment
      - Finished-video audio architecture resolves narration or source speech, captions, BGM, and natural sound without leaving them as optional decoration
    success_criteria:
      - Schema-valid brief and decision_log artifacts
      - Brief metadata contains subject_facts_profile_ref, an OpenMontage-resolved subject dossier projection, platform_profile_ref, source inventory, and audio architecture

  - name: proposal
    skill: pipelines/golden-key-subject-ip/proposal-director
    required_artifacts_in:
      - brief
    optional_artifacts_in:
      - source_media_review
      - video_analysis_brief
    produces:
      - proposal_packet
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - At least three concepts create genuinely different subject-led emotional structures
      - The creative winner is selected before OpenMontage authors any concept-specific material query
      - Each concept distinguishes cited ProjectContentContext evidence from interpretation and stays inside its frozen selected source scope
      - Production plan names the exact source-led, support, audio, identity-protection, and fallback decisions
      - Remotion and HyperFrames are both presented when available and render_runtime is explicitly approved
      - Music source and voice treatment are resolved before asset generation
      - Text roles are classified before choosing ordinary captions, word highlighting, expressive overlays, titles, annotations, or CTA treatment
    success_criteria:
      - Schema-valid proposal_packet and decision_log artifacts
      - Selected concept, render runtime, composition mode, audio plan, cost, and approval status are explicit
    sub_stages:
      - name: sample
        description: "10-15 second subject-IP preview for reference-driven productions"
        condition: "video_analysis_brief_exists"
        human_approval_default: true
        tools_available: [talking_head, lip_sync, tts_selector, image_selector, video_selector, subtitle_gen, video_compose, audio_mixer]
        review_focus:
          - "Sample proves the selected subject treatment without copying the reference"
          - "Subject identity and voice treatment match the approved profile"
          - "Pacing, captions, music, and natural sound fit the approved PlatformProfile"

  - name: script
    skill: pipelines/golden-key-subject-ip/script-director
    required_artifacts_in:
      - brief
      - proposal_packet
    optional_artifacts_in:
      - source_media_review
    produces:
      - script
    optional_tools:
      - transcriber
      - scene_detect
    tools_available:
      - transcriber
      - scene_detect
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook and emotional promise fit the selected platform and introduce the subject immediately
      - One primary viewer payoff and at most one secondary payoff connect the opening promise, evidence, suspense payoff, and complete ending
      - Subject personality is grounded in observable source evidence and interpretation is not presented as fact
      - Every material-backed fact, quotation, visible text, or visual obligation cites the exact ProjectContentContext evidence and source anchor
      - Narration, source speech, expressive captions, BGM beats, and natural-sound moments form one finished audio story
      - Script establishes a reusable subject identity without turning into a generic footage montage
    success_criteria:
      - Schema-valid script artifact
      - Every section states its source evidence, subject function, audio carrier, and emotional beat

  - name: scene_plan
    skill: pipelines/golden-key-subject-ip/scene-director
    required_artifacts_in:
      - script
      - brief
      - proposal_packet
    optional_artifacts_in:
      - source_media_review
    produces:
      - scene_plan
    optional_tools:
      - frame_sampler
      - scene_detect
      - face_tracker
    tools_available:
      - frame_sampler
      - scene_detect
      - face_tracker
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Subject is visible or narratively present throughout the arc and identity anchors remain protected
      - First three seconds, emotional turn, recognition beat, and landing frame are deliberately planned
      - Generated or graphic support solves named gaps and never impersonates documentary source evidence
      - Video uses exact temporal ranges while images and documents use exact region/page/table anchors, display duration, permissions, and legibility/redaction checks
      - Vertical safe zones, captions, overlays, and subject framing follow the PlatformProfile
    success_criteria:
      - Schema-valid scene_plan artifact
      - Every scene has source lineage or an explicit generated/support designation
      - metadata shot plan covers every scene with exact temporal ranges or still/document anchors and the applicable timeline math

  - name: assets
    skill: pipelines/golden-key-subject-ip/asset-director
    required_artifacts_in:
      - scene_plan
      - proposal_packet
    optional_artifacts_in:
      - script
      - brief
      - source_media_review
    produces:
      - asset_manifest
    optional_tools:
      - subtitle_gen
      - talking_head
      - lip_sync
      - tts_selector
      - image_selector
      - video_selector
      - pixabay_music
      - freesound_music
      - music_gen
      - audio_enhance
    tools_available:
      - subtitle_gen
      - talking_head
      - lip_sync
      - tts_selector
      - image_selector
      - video_selector
      - pixabay_music
      - freesound_music
      - music_gen
      - audio_enhance
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - The approved truth source matches subject type and every real, designed, or generated asset has provenance
      - Generated assets preserve identity anchors and are labeled as generated rather than real behavior evidence
      - Narration or source-speech treatment, captions, BGM, and natural-sound assets match the approved audio architecture
      - One sample of each paid or identity-sensitive asset type is approved before batch generation
    success_criteria:
      - Schema-valid asset_manifest artifact
      - All referenced asset files exist and generated assets include provider, model, prompt, seed when available, and subject-protection metadata

  - name: edit
    skill: pipelines/golden-key-subject-ip/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
      - proposal_packet
    optional_artifacts_in:
      - script
      - brief
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Subject-led anchor cut works before graphics and generated support are added
      - Hook, contrast, emotional turn, recognition beat, and ending have intentional pacing
      - Narration or source speech, captions, music, effects, and natural sound are mixed as a finished-video plan
      - Overlay density and transition style do not hide subject performance or flatten authentic moments
      - Text-layer roles, deliveries, renderers, and mixed-layer attention policy are explicit and semantically valid
      - The final subject beat has explicit picture, text, and audio closure
    success_criteria:
      - Schema-valid edit_decisions artifact
      - Edit decisions cover the full runtime and preserve the approved render_runtime and audio architecture
      - metadata.text_layer_direction passes the native semantic validator

  - name: compose
    skill: pipelines/golden-key-subject-ip/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
      - proposal_packet
    optional_artifacts_in:
      - scene_plan
      - script
      - brief
    produces:
      - render_report
      - final_review
    required_tools:
      - video_compose
      - audio_mixer
    optional_tools:
      - remotion_caption_burn
      - video_stitch
      - video_trimmer
      - color_grade
      - audio_enhance
      - visual_qa
    tools_available:
      - video_compose
      - remotion_caption_burn
      - hyperframes_compose
      - audio_mixer
      - video_stitch
      - video_trimmer
      - color_grade
      - audio_enhance
      - visual_qa
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - render_runtime matches proposal_packet and no silent runtime or provider substitution occurred
      - Subject identity, markings, face, voice, proportions, or design anchors remain consistent
      - Audio feels finished and supports the intended emotional value on the selected platform
      - Final render passes technical checks and generated-content disclosure rules
      - Continuous captions and expressive text match their approved roles without unplanned wrapping or attention competition
      - Dedicated last-second temporal evidence proves the ending is intentional rather than truncated
    success_criteria:
      - Schema-valid render_report and final_review artifacts
      - Output exists, passes ffprobe and decode validation, and records identity and audio QA

  - name: publish
    skill: pipelines/golden-key-subject-ip/publish-director
    required_artifacts_in:
      - render_report
      - final_review
    optional_artifacts_in:
      - brief
      - proposal_packet
      - script
    produces:
      - publish_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Title, caption, cover, tags, and first-frame promise fit the selected PlatformProfile
      - Packaging reinforces recurring subject identity and series continuity without false claims
      - Rights, music, voice, likeness, and generated-content disclosures are complete
      - CTA supports follow, recall, or the approved next episode rather than introducing an unrelated sales objective
      - Title pain/value, one-focus cover, evidence-bounded copy, relevant tags, and at most one interaction action match the actual episode
    success_criteria:
      - Schema-valid publish_log artifact
      - Export package contains the approved video, cover guidance, platform copy, provenance, and disclosure notes
