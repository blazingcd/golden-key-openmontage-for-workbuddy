version: "1.0"
scope: golden-key-four-pipeline-six-condition-matrix
selected_pipeline_policy: null_for_product_routing
conditions: [normal_sufficient, key_information_missing, input_conflict, irrelevant_material, adjacent_pipeline_confusion, same_material_changed_goal]
cases:
  - {id: subject-normal, pipeline_under_test: golden-key-subject-ip, condition: normal_sufficient, request: "讲创始人的真实经历，让观众认识并信任她", facts: [subject_identity, authorized_story, likeness_rights], expected: {route: golden-key-subject-ip, clarification_needed: false}}
  - {id: subject-missing, pipeline_under_test: golden-key-subject-ip, condition: key_information_missing, request: "用这个人做长期IP内容", facts: [subject_identity], missing: [likeness_rights, primary_viewer_outcome], expected: {route: golden-key-subject-ip, clarification_needed: true, blocker: subject_rights_and_outcome}}
  - {id: subject-conflict, pipeline_under_test: golden-key-subject-ip, condition: input_conflict, request: "既要大家记住创始人，也要立刻买产品", facts: [subject_identity, product_exists], expected: {route: pending, clarification_needed: true, blocker: dominant_outcome}}
  - {id: subject-irrelevant, pipeline_under_test: golden-key-subject-ip, condition: irrelevant_material, request: "讲她真实转折经历，让大家记住她", facts: [authorized_story], distractor: unrelated_product_brochure, expected: {route: golden-key-subject-ip, clarification_needed: false, ignored: unrelated_product_brochure}}
  - {id: subject-adjacent, pipeline_under_test: golden-key-subject-ip, condition: adjacent_pipeline_confusion, request: "让创始人出镜，用团队和流程说明公司为何坚持透明服务", facts: [company_process, company_value], expected: {route: golden-key-brand-company, clarification_needed: false}}
  - {id: subject-changed-goal, pipeline_under_test: golden-key-subject-ip, condition: same_material_changed_goal, material_set: founder-footage-a, request: "用同一批创始人素材吸引合适的人评论关键词加入项目", facts: [verified_offer, qualification, comment_keyword, response_owner], expected: {route: golden-key-lead-conversion, clarification_needed: false}}

  - {id: product-normal, pipeline_under_test: golden-key-product-marketing, condition: normal_sufficient, request: "做舒缓服务到店放松体验种草视频，希望收藏点赞", facts: [in_store_service, audience_desire, experience_boundary], expected: {route: golden-key-product-marketing, clarification_needed: false}}
  - {id: product-missing, pipeline_under_test: golden-key-product-marketing, condition: key_information_missing, request: "帮这个产品做营销视频", facts: [], missing: [marketed_object, verified_benefit], expected: {route: pending, clarification_needed: true, blocker: marketed_object}}
  - {id: product-conflict, pipeline_under_test: golden-key-product-marketing, condition: input_conflict, request: "既做体验种草又筛选加盟申请人", facts: [service_experience, franchise_offer], expected: {route: pending, clarification_needed: true, blocker: dominant_outcome}}
  - {id: product-irrelevant, pipeline_under_test: golden-key-product-marketing, condition: irrelevant_material, request: "介绍舒缓服务到店体验", facts: [in_store_service], distractor: unrelated_company_handbook, expected: {route: golden-key-product-marketing, clarification_needed: false, ignored: unrelated_company_handbook}}
  - {id: product-adjacent, pipeline_under_test: golden-key-product-marketing, condition: adjacent_pipeline_confusion, request: "说明套餐、适用条件和预约入口，引导同城用户预约", facts: [verified_offer, qualification, booking_path], expected: {route: golden-key-lead-conversion, clarification_needed: false}}
  - {id: product-changed-goal, pipeline_under_test: golden-key-product-marketing, condition: same_material_changed_goal, material_set: wellness-studio-library-a, request: "用同一批舒缓服务素材做放松体验种草，主要希望收藏保存", facts: [in_store_service], expected: {route: golden-key-product-marketing, clarification_needed: false}}

  - {id: brand-normal, pipeline_under_test: golden-key-brand-company, condition: normal_sufficient, request: "用团队和真实服务过程表达公司为什么坚持透明", facts: [company_identity, transparency_principle, process_evidence], expected: {route: golden-key-brand-company, clarification_needed: false}}
  - {id: brand-missing, pipeline_under_test: golden-key-brand-company, condition: key_information_missing, request: "讲公司为什么值得信任", facts: [company_identity], missing: [verified_company_evidence], expected: {route: golden-key-brand-company, clarification_needed: true, blocker: company_evidence}}
  - {id: brand-conflict, pipeline_under_test: golden-key-brand-company, condition: input_conflict, request: "既建立公司品牌信任又马上卖这款产品", facts: [company_identity, product_exists], expected: {route: pending, clarification_needed: true, blocker: dominant_outcome}}
  - {id: brand-irrelevant, pipeline_under_test: golden-key-brand-company, condition: irrelevant_material, request: "用真实流程说明公司的透明原则", facts: [company_process, transparency_principle], distractor: founder_private_life_story, expected: {route: golden-key-brand-company, clarification_needed: false, ignored: founder_private_life_story}}
  - {id: brand-adjacent, pipeline_under_test: golden-key-brand-company, condition: adjacent_pipeline_confusion, request: "以品牌名义讲产品三个卖点并引导购买", facts: [verified_product_evidence, purchase_action], expected: {route: golden-key-product-marketing, clarification_needed: false}}
  - {id: brand-changed-goal, pipeline_under_test: golden-key-brand-company, condition: same_material_changed_goal, material_set: company-library-a, request: "用同一批公司素材吸引渠道伙伴提交合作咨询", facts: [channel_offer, qualification, inquiry_path], expected: {route: golden-key-lead-conversion, clarification_needed: false}}

  - {id: lead-normal, pipeline_under_test: golden-key-lead-conversion, condition: normal_sufficient, request: "介绍合作项目并让合适的人评论关键词", facts: [verified_offer, mechanism, qualification, comment_keyword, response_owner], expected: {route: golden-key-lead-conversion, clarification_needed: false}}
  - {id: lead-missing, pipeline_under_test: golden-key-lead-conversion, condition: key_information_missing, request: "介绍合作方案并引导提交申请", facts: [verified_offer, application_path], missing: [qualification], expected: {route: golden-key-lead-conversion, clarification_needed: true, blocker: qualification}}
  - {id: lead-conflict, pipeline_under_test: golden-key-lead-conversion, condition: input_conflict, request: "让用户评论或私信或预约都可以", facts: [verified_offer, qualification], expected: {route: golden-key-lead-conversion, clarification_needed: true, blocker: one_primary_cta}}
  - {id: lead-irrelevant, pipeline_under_test: golden-key-lead-conversion, condition: irrelevant_material, request: "介绍合作机制并让合适的人评论关键词", facts: [verified_offer, mechanism, qualification, comment_keyword], distractor: generic_lifestyle_footage, expected: {route: golden-key-lead-conversion, clarification_needed: false, ignored_as_proof: generic_lifestyle_footage}}
  - {id: lead-adjacent, pipeline_under_test: golden-key-lead-conversion, condition: adjacent_pipeline_confusion, request: "介绍门店放松体验，希望大家收藏以后来体验", facts: [in_store_service], expected: {route: golden-key-product-marketing, clarification_needed: false}}
  - {id: lead-changed-goal, pipeline_under_test: golden-key-lead-conversion, condition: same_material_changed_goal, material_set: founder-footage-a, request: "用同一批素材讲创始人的转折经历，让大家认识并关注她", facts: [authorized_story, likeness_rights], expected: {route: golden-key-subject-ip, clarification_needed: false}}
