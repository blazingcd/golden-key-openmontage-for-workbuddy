version: "1.0"
scope: golden-key-four-pipeline-six-condition-matrix
run_actor: codex-session-agent-following-openmontage-v0.3.11-manifests-and-decision-policies
review_actor: same-run-pipeline-rubric-review
independence_limit: reviewer_is_not_independent
external_llm_called: false
cases:
  - {id: subject-normal, actual: {route: golden-key-subject-ip, clarification_needed: false, rationale: "The founder's authorized personal story and recognition/trust outcome make the recurring person irreplaceable.", review_status: pass}}
  - {id: subject-missing, actual: {route: golden-key-subject-ip, clarification_needed: true, blocker: subject_rights_and_outcome, business_question: "这条内容最希望观众记住他/她什么，以及是否已授权使用其肖像和相关经历？", rationale: "The subject route is plausible, but viewer outcome and likeness/story rights are required before a safe brief.", review_status: pass}}
  - {id: subject-conflict, actual: {route: pending, clarification_needed: true, blocker: dominant_outcome, business_question: "这条片最优先要让观众记住并信任创始人，还是先判断产品是否值得购买？", rationale: "Subject affinity and immediate purchase are incompatible primary obligations.", review_status: pass}}
  - {id: subject-irrelevant, actual: {route: golden-key-subject-ip, clarification_needed: false, ignored: unrelated_product_brochure, rationale: "The authorized turning-point story carries the person-led promise; the unrelated brochure has no evidence role.", review_status: pass}}
  - {id: subject-adjacent, actual: {route: golden-key-brand-company, clarification_needed: false, rationale: "The founder is a presenter, while company values, team, and process are the communication object and proof.", review_status: pass}}
  - {id: subject-changed-goal, actual: {route: golden-key-lead-conversion, clarification_needed: false, rationale: "With the same founder footage, a verified project offer, qualification, and comment-keyword action make qualified conversion dominant.", review_status: pass}}

  - {id: product-normal, actual: {route: golden-key-product-marketing, clarification_needed: false, rationale: "The request seeks awareness and consideration of an in-store relaxation experience with a soft save action.", review_status: pass}}
  - {id: product-missing, actual: {route: pending, clarification_needed: true, blocker: marketed_object, business_question: "这次具体要介绍哪项产品或服务，以及目前有哪些已经核实、可以公开表达的特点？", rationale: "No marketed object or verified benefit exists, so route and truth obligations cannot be resolved safely.", review_status: pass}}
  - {id: product-conflict, actual: {route: pending, clarification_needed: true, blocker: dominant_outcome, business_question: "这条片更重要的是让顾客了解服务体验，还是筛选并吸引合适的加盟申请人？", rationale: "Service consideration and qualified franchise acquisition require different proof and CTA obligations.", review_status: pass}}
  - {id: product-irrelevant, actual: {route: golden-key-product-marketing, clarification_needed: false, ignored: unrelated_company_handbook, rationale: "The in-store service is the marketed object; an unrelated company handbook cannot establish its benefits.", review_status: pass}}
  - {id: product-adjacent, actual: {route: golden-key-lead-conversion, clarification_needed: false, rationale: "Verified package, suitability boundary, and booking path make direct qualified appointment conversion dominant.", review_status: pass}}
  - {id: product-changed-goal, actual: {route: golden-key-product-marketing, clarification_needed: false, rationale: "The same wellness-studio media supports experience consideration and a save action; no qualification or direct booking mechanism dominates.", review_status: pass}}

  - {id: brand-normal, actual: {route: golden-key-brand-company, clarification_needed: false, rationale: "Company identity and a verified transparency principle are expressed through real process evidence.", review_status: pass}}
  - {id: brand-missing, actual: {route: golden-key-brand-company, clarification_needed: true, blocker: company_evidence, business_question: "目前有哪些已核实的团队、流程、制度或客户可见事实，能够支持“值得信任”这件事？", rationale: "The route is company reputation, but trust cannot be converted from a slogan into fact without evidence.", review_status: pass}}
  - {id: brand-conflict, actual: {route: pending, clarification_needed: true, blocker: dominant_outcome, business_question: "这条片最优先是让人理解并信任公司，还是先让人购买这款具体产品？", rationale: "Brand meaning and immediate product purchase are competing primary outcomes.", review_status: pass}}
  - {id: brand-irrelevant, actual: {route: golden-key-brand-company, clarification_needed: false, ignored: founder_private_life_story, rationale: "Verified company process supports the transparency thesis; unrelated private life cannot become company proof.", review_status: pass}}
  - {id: brand-adjacent, actual: {route: golden-key-product-marketing, clarification_needed: false, rationale: "A concrete product, three verified benefits, and purchase action dominate despite brand authorship.", review_status: pass}}
  - {id: brand-changed-goal, actual: {route: golden-key-lead-conversion, clarification_needed: false, rationale: "With the same company media, a verified channel offer, qualification, and inquiry path create a lead-conversion job.", review_status: pass}}

  - {id: lead-normal, actual: {route: golden-key-lead-conversion, clarification_needed: false, rationale: "Verified offer, mechanism, qualification, one comment signal, and response owner create a complete qualified invitation route.", review_status: pass}}
  - {id: lead-missing, actual: {route: golden-key-lead-conversion, clarification_needed: true, blocker: qualification, business_question: "哪些人或企业适合提交，至少要满足哪些条件？", rationale: "The offer and application path establish the route, but qualification is a required safety and conversion boundary.", review_status: pass}}
  - {id: lead-conflict, actual: {route: golden-key-lead-conversion, clarification_needed: true, blocker: one_primary_cta, business_question: "这条视频最终只保留一个动作：评论、私信还是预约，哪一个最重要？", rationale: "The lead route is clear, but three competing actions violate the one-primary-CTA contract.", review_status: pass}}
  - {id: lead-irrelevant, actual: {route: golden-key-lead-conversion, clarification_needed: false, ignored_as_proof: generic_lifestyle_footage, rationale: "Generic lifestyle footage may attract attention but cannot prove the offer, mechanism, fit, or outcome.", review_status: pass}}
  - {id: lead-adjacent, actual: {route: golden-key-product-marketing, clarification_needed: false, rationale: "A soft save/experience goal without an offer, qualification, or booking mechanism remains product marketing.", review_status: pass}}
  - {id: lead-changed-goal, actual: {route: golden-key-subject-ip, clarification_needed: false, rationale: "With the same founder footage, an authorized turning-point story and follow/recognition outcome make the person the primary promise.", review_status: pass}}
