version: "1.0"
scope: golden-key-four-custom-pipeline-route-robustness
run_actor: codex-session-agent-following-openmontage-manifests-and-skills
review_actor: same-run-rubric-review
independence_limit: reviewer_is_not_independent
external_llm_called: false
cases:
  - id: project-lead-join-project-conversion-goal
    actual:
      route: golden-key-lead-conversion
      clarification_needed: false
      rationale: "The completed Q&A makes attracting qualified people to join the project lead's project the primary business outcome. Person-led trust is the creative approach, not the route. The customer has now verified one comment-keyword signal and that account operations staff will respond, so no further business-language routing question is needed; project details, reply timing and outcomes remain excluded."
      review_status: pass
  - id: service-with-store-visit-distractor
    actual:
      route: golden-key-product-marketing
      clarification_needed: false
      rationale: "Store-visit intent remains consideration when only real service experience is verified and no booking mechanism or qualification exists."
      review_status: pass

  - id: service-with-complete-booking-mechanism
    actual:
      route: golden-key-lead-conversion
      clarification_needed: false
      rationale: "Verified offer, mechanism, qualification and one submission action make direct conversion the dominant job."
      review_status: pass

  - id: wellness-studio-comment-or-dm-acquisition-command
    actual:
      route: golden-key-lead-conversion
      clarification_needed: false
      rationale: "The exact customer command makes direct consultation the primary obligation, so Lead Conversion outranks Product Marketing despite sharing the same wellness-studio facts and material library. The customer verified that a person will reply; the Agent selects one private-message CTA and must not invent responder identity, response time, script or booking outcome."
      review_status: pass

  - id: founder-trust-without-offer
    actual:
      route: golden-key-subject-ip
      clarification_needed: false
      rationale: "Recognition and trust around the founder dominate; a job title alone does not turn the piece into company proof."
      review_status: pass

  - id: company-thesis-with-product-cameo
    actual:
      route: golden-key-brand-company
      clarification_needed: false
      rationale: "Verified company identity and values are the thesis; the product is supporting evidence rather than the marketed object."
      review_status: pass

  - id: brand-name-but-product-purchase-dominates
    actual:
      route: golden-key-product-marketing
      clarification_needed: false
      rationale: "A concrete product, verified benefit evidence and purchase action dominate despite the brand name appearing in the command."
      review_status: pass

  - id: ambiguous-brand-growth-command
    actual:
      route: pending
      clarification_needed: true
      business_question: "这次更重要的是先让人理解并记住品牌，还是已经有明确服务方案和提交入口、要筛选合适客户？"
      rationale: "The command does not distinguish brand memory from qualified conversion, so one business-language question is required."
      review_status: pass

  - id: lead-route-missing-qualification
    actual:
      route: golden-key-lead-conversion
      clarification_needed: true
      business_question: "哪些人或企业适合提交，至少要满足哪些条件？"
      blocker_until_answered: qualification
      rationale: "The offer and mechanism establish the route, but qualification is required before a safe lead-conversion brief can pass."
      review_status: pass

  - id: person-versus-product-conflict
    actual:
      route: pending
      clarification_needed: true
      business_question: "这条片最优先要让观众记住并信任创始人，还是先判断产品是否值得购买？"
      rationale: "Two incompatible primary outcomes are equally asserted, so the Agent asks about the business priority without exposing technical Pipeline names."
      review_status: pass

  - id: controlled-fixture-is-not-customer-proof
    actual:
      route: golden-key-brand-company
      clarification_needed: false
      real_customer_acceptance_claimed: false
      publish_allowed: false
      rationale: "Explicit Pipeline selection is allowed only for the specialized benchmark; the fixture remains non-customer and non-publishable."
      review_status: pass
