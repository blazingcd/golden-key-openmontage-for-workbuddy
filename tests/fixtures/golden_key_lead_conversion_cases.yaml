version: "1.0"
cases:
  - id: wellness-studio-qualified-booking
    input:
      request: "向同城合适用户说明套餐和适用条件，引导预约"
      platform: douyin
      verified_offer: true
      verified_mechanism: true
      qualification: true
      primary_cta: "submit booking inquiry"
    expected:
      route: golden-key-lead-conversion
      structure: relevance_to_mechanism_to_proof_to_qualification_to_cta
      reject: [invented_effect, fake_urgency, generic_unqualified_cta]

  - id: sample-pet-ip-collaboration
    input:
      request: "用示例宠物吸引宠物品牌来谈IP合作"
      verified_collaboration_offer: true
      qualification: true
      proof: true
      primary_cta: true
    expected:
      route: golden-key-lead-conversion
      sample_pet_role: attention_and_audience_empathy_not_conversion_proof
      reject: [invented_partnership_result, sample_pet_as_customer_case]

  - id: soft-service-seeding
    input:
      request: "做一条门店种草片，让用户先收藏"
      goal: "consideration"
      direct_booking_cta: false
    expected:
      route: golden-key-product-marketing

  - id: founder-recognition
    input:
      request: "让大家觉得创始人靠谱并愿意持续关注"
      goal: "person trust and recognition"
      offer: null
    expected:
      route: golden-key-subject-ip
