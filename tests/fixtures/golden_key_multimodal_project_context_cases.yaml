version: "1.0"
scope: golden-key-multimodal-project-content-context-director-robustness
input_contract: ProjectContentContext@0.1
cases:
  - id: sufficient-product-document
    request: "做一条介绍舒缓服务到店体验的营销视频"
    selected_pipeline: null
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [wellness-studio-service-document]
      evidence:
        - kind: document_fact
          fact: "该服务为到店体验，不提供上门服务"
          anchor: "page:2"
        - kind: document_fact
          fact: "当前体验价299元，有效至2026-12-31"
          anchor: "page:3/table:offer/cell:B4:C4"
    expected:
      route: golden-key-product-marketing
      disposition: proceed
      required_effects: [cite_document_facts, keep_store_only_boundary, keep_price_validity]

  - id: image-only-no-video
    request: "用已选素材做一条门店体验种草视频"
    selected_pipeline: null
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [wellness-studio-room-image]
      evidence:
        - kind: image_observation
          fact: "暖色安静的舒缓体验房间，未显示品牌名或服务效果"
          anchor: "image-region:0,0,1,1"
    expected:
      route: golden-key-product-marketing
      disposition: proceed_with_evidence_gap
      required_effects: [static_image_scene_anchor, no_fake_temporal_range, no_efficacy_claim]

  - id: unresolved-old-new-price-conflict
    request: "把体验价写进舒缓服务营销视频"
    selected_pipeline: null
    context:
      status: clarification_required
      selection_mode: explicit
      selected_assets: [old-offer-document, new-offer-document]
      conflict:
        fact_key: offer.experience_price
        values: [299, 399]
        question: "本项目应采用299元还是399元？"
    expected:
      route: golden-key-product-marketing
      disposition: ask_one_business_question
      business_question: "本项目应采用299元还是399元？"
      forbidden_effects: [guess_newest, guess_lowest, write_price_claim]

  - id: expired-offer-document
    request: "按资料里的套餐做获客视频"
    selected_pipeline: null
    context:
      status: blocked
      selection_mode: explicit
      selected_assets: [expired-offer-document]
      warning: "资料有效期已结束，ReferenceEligibility不是referenceable"
    expected:
      route: pending
      disposition: block_before_idea
      required_effects: [request_current_offer_fact, preserve_expired_warning]

  - id: confidential-brand-document
    request: "固定测试品牌企业传播导演能力"
    selected_pipeline: golden-key-brand-company
    benchmark_only: true
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [benchmark-company-handbook]
      permissions: [director_context, private_review]
      prohibited_permissions: [public_publish]
    expected:
      route: golden-key-brand-company
      disposition: private_director_only
      real_customer_acceptance_claimed: false
      required_effects: [may_constrain_direction, do_not_quote_or_show_publicly]

  - id: prohibited-expression
    request: "做一条舒缓服务放松体验视频"
    selected_pipeline: null
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [wellness-studio-service-document]
      prohibition:
        expression: "治愈失眠"
        anchor: "page:2"
    expected:
      route: golden-key-product-marketing
      disposition: proceed
      required_effects: [exclude_prohibited_expression, keep_experience_not_medical]

  - id: similar-product-document-interference
    request: "介绍A项目的透明服务原则"
    selected_pipeline: null
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [project-a-handbook, similar-project-b-brochure]
      evidence_scope:
        target: project-a-handbook
        distractor: similar-project-b-brochure
    expected:
      route: golden-key-brand-company
      disposition: proceed
      required_effects: [use_target_identity_only, record_distractor_unused]
      forbidden_effects: [borrow_similar_product_price, borrow_similar_product_claim]

  - id: no-selected-material
    request: "做一条介绍门店放松体验的营销视频"
    selected_pipeline: null
    context:
      status: ready_empty
      selection_mode: none
      selected_assets: []
    expected:
      route: golden-key-product-marketing
      disposition: proceed_with_evidence_gap
      required_effects: [no_library_retrieval, no_material_claim, expose_visual_gap]

  - id: project-a-context-given-to-project-b
    request: "为项目B制作品牌视频"
    selected_pipeline: null
    handoff_project_id: project-b
    context:
      project_id: project-a
      status: ready
      selection_mode: explicit
      selected_assets: [project-a-handbook]
    expected:
      route: pending
      disposition: block_before_pipeline_selection
      required_effects: [project_id_mismatch_blocker, no_project_a_evidence]

  - id: same-command-with-company-document
    pair_id: company-context-difference
    request: "做一条讲清楚我们为什么坚持透明服务的视频"
    selected_pipeline: null
    context:
      status: ready
      selection_mode: explicit
      selected_assets: [benchmark-company-handbook]
      evidence:
        - kind: document_fact
          fact: "受控Fixture明确列出透明报价和过程说明原则"
          anchor: "page:4/table:service-principles"
    benchmark_only: true
    expected:
      route: golden-key-brand-company
      disposition: proceed_private_benchmark
      required_effects: [specific_thesis_evidence, exact_document_anchor]

  - id: same-command-without-company-document
    pair_id: company-context-difference
    request: "做一条讲清楚我们为什么坚持透明服务的视频"
    selected_pipeline: null
    context:
      status: ready_empty
      selection_mode: none
      selected_assets: []
    benchmark_only: true
    expected:
      route: golden-key-brand-company
      disposition: block_for_company_evidence
      required_effects: [no_library_retrieval, ask_for_verified_transparency_evidence]
