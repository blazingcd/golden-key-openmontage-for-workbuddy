version: "1.0"
scope: golden-key-multimodal-project-content-context-director-robustness
run_actor: codex-session-agent-following-openmontage-v0.3.11-manifests-and-stage-skills
review_actor: same-run-pipeline-rubric-review
independence_limit: reviewer_is_not_independent
external_llm_called: false
execution_provider_called: false
cases:
  - id: sufficient-product-document
    actual:
      route: golden-key-product-marketing
      disposition: proceed
      effects: [cite_document_facts, keep_store_only_boundary, keep_price_validity]
      rationale: "The marketed object is the verified in-store service. The two document facts may shape claim/evidence planning only with their exact page/table anchors and validity; the document does not supply a concept."
      review_status: pass
  - id: image-only-no-video
    actual:
      route: golden-key-product-marketing
      disposition: proceed_with_evidence_gap
      effects: [static_image_scene_anchor, no_fake_temporal_range, no_efficacy_claim]
      rationale: "The image proves only a warm quiet room. A ScenePlan may use the cited region with display duration and crop/motion treatment, but cannot invent video seconds or a therapeutic result."
      review_status: pass
  - id: unresolved-old-new-price-conflict
    actual:
      route: golden-key-product-marketing
      disposition: ask_one_business_question
      business_question: "本项目应采用299元还是399元？"
      effects: [block_price_claim]
      rationale: "The command establishes product marketing, while the unresolved price conflict blocks only the affected price decision until a new context revision records the answer."
      review_status: pass
  - id: expired-offer-document
    actual:
      route: pending
      disposition: block_before_idea
      effects: [request_current_offer_fact, preserve_expired_warning]
      rationale: "The requested conversion treatment depends on an expired offer document, so the Handoff cannot present it as referenceable evidence and the Agent must not infer current terms."
      review_status: pass
  - id: confidential-brand-document
    actual:
      route: golden-key-brand-company
      disposition: private_director_only
      real_customer_acceptance_claimed: false
      effects: [may_constrain_direction, do_not_quote_or_show_publicly]
      rationale: "Explicit Pipeline selection is allowed for this specialized benchmark. Confidential facts can constrain the private plan but cannot appear as public copy or document imagery, and the fixture cannot prove a real customer case."
      review_status: pass
  - id: prohibited-expression
    actual:
      route: golden-key-product-marketing
      disposition: proceed
      effects: [exclude_prohibited_expression, keep_experience_not_medical]
      rationale: "The prohibition is binding evidence. The Director can frame a relaxation experience but must reject medical or sleep-treatment language even if it sounds persuasive."
      review_status: pass
  - id: similar-product-document-interference
    actual:
      route: golden-key-brand-company
      disposition: proceed
      effects: [use_target_identity_only, record_distractor_unused]
      rationale: "The request and target identity refer to project A. Similar project B material is a distractor and cannot lend price, proof, identity, or company claims merely because retrieval found it."
      review_status: pass
  - id: no-selected-material
    actual:
      route: golden-key-product-marketing
      disposition: proceed_with_evidence_gap
      effects: [no_library_retrieval, no_material_claim, expose_visual_gap]
      rationale: "The user command establishes product marketing without selected assets. The Agent may plan from other verified facts, but selection_mode none forbids library retrieval and leaves an explicit visual-evidence gap."
      review_status: pass
  - id: project-a-context-given-to-project-b
    actual:
      route: pending
      disposition: block_before_pipeline_selection
      effects: [project_id_mismatch_blocker, no_project_a_evidence]
      rationale: "The Handoff and context project identities differ, so the evidence envelope is unresolved before route selection and no project A fact may enter project B."
      review_status: pass
  - id: same-command-with-company-document
    actual:
      route: golden-key-brand-company
      disposition: proceed_private_benchmark
      effects: [specific_thesis_evidence, exact_document_anchor]
      rationale: "The controlled document provides a specific private evidence basis for a transparency thesis, while OpenMontage still owns the concept and script."
      review_status: pass
  - id: same-command-without-company-document
    actual:
      route: golden-key-brand-company
      disposition: block_for_company_evidence
      effects: [no_library_retrieval, ask_for_verified_transparency_evidence]
      rationale: "The same command still routes to brand/company, but without selected company evidence the Agent cannot turn transparency into a factual thesis and must block for verified support."
      review_status: pass
