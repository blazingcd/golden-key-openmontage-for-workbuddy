version: "1.0"
pipeline: golden-key-subject-ip
cases:
  - id: animal-source-story
    input:
      primary_goal: affinity
      subject_type: animal
      source_coverage: sufficient
      rights: confirmed
      platform: xiaohongshu
      capabilities: [analysis, subtitles, audio_processing, music_search, video_post]
    expected:
      route: golden-key-subject-ip
      episode_role: affinity
      narrative_driver: observed_action
      presenter_mode: none
      visual_backbone: real_source
      use: [narration_or_expressive_captions, bgm, selected_natural_sound]
      do_not_use: [avatar, unverified_animal_motive, product_cta, decorative_i2v]
      blocker_if_missing: [resolved_subject_profile, resolved_platform_rules, approved_voice_or_caption_path]

  - id: human-authority-original-voice
    input:
      primary_goal: authority
      subject_type: person
      source_coverage: strong_original_speech
      rights: confirmed
      platform: wechat_channels
      capabilities: [analysis, subtitles, audio_processing, video_post]
    expected:
      route: golden-key-subject-ip
      episode_role: authority
      narrative_driver: original_voice
      presenter_mode: real_original
      visual_backbone: presenter_plus_broll
      use: [original_speech, captions, restrained_bgm]
      do_not_use: [generic_tts_replacement, avatar_without_need, playful_voice]
      blocker_if_missing: [speech_lineage, likeness_consent]

  - id: virtual-character-existing-assets
    input:
      primary_goal: series_continuity
      subject_type: virtual_character
      source_coverage: approved_design_and_rig
      rights: confirmed
      platform: douyin
      capabilities: [character_animation, subtitles, audio_processing, video_post]
    expected:
      route: golden-key-subject-ip
      episode_role: series_continuity
      narrative_driver: character_performance
      presenter_mode: none
      visual_backbone: approved_character_assets
      use: [approved_character_voice_or_captions, animation, designed_music_and_sfx]
      do_not_use: [real-footage-first-rule, inconsistent_character_voice, documentary_claim]
      blocker_if_missing: [design_profile_hash, rig_or_motion_assets]

  - id: virtual-character-needs-new-rig
    input:
      primary_goal: series_continuity
      subject_type: virtual_character
      source_coverage: concept_only
      rights: confirmed
      platform: generic
      capabilities: [character_animation]
    expected:
      route: character-animation
      episode_role: series_continuity
      narrative_driver: character_performance
      presenter_mode: none
      visual_backbone: approved_character_assets
      use: [character_design_prerequisite, rig_plan_prerequisite]
      do_not_use: [invented_unapproved_design, subject_ip_episode_before_rig]
      blocker_if_missing: [approved_character_design]

  - id: product-sales-route-out
    input:
      primary_goal: purchase
      subject_type: animal
      source_coverage: sufficient
      rights: confirmed
      platform: xiaohongshu
      capabilities: [video_post]
    expected:
      route: golden-key-product-marketing
      episode_role: none
      narrative_driver: none
      presenter_mode: none
      visual_backbone: none
      use: [verified_product_facts, product_evidence, purchase_cta]
      do_not_use: [subject_affinity_as_false_route]
      blocker_if_missing: [product_facts, product_evidence]

  - id: voice-clone-without-consent
    input:
      primary_goal: trust
      subject_type: person
      source_coverage: stills_only
      rights: likeness_only
      platform: kuaishou
      capabilities: [tts, subtitles, video_post]
    expected:
      route: golden-key-subject-ip
      episode_role: trust
      narrative_driver: narration
      presenter_mode: real_rerecord
      visual_backbone: narrated_source_story
      use: [real_rerecord_or_bring_your_own_voice, captions]
      do_not_use: [voice_clone, fabricated_direct_address]
      blocker_if_missing: [authorized_voice_path]

  - id: reference-driven-sample
    input:
      primary_goal: recognition
      subject_type: mascot
      source_coverage: approved_character_assets
      rights: confirmed
      platform: douyin
      reference_video: true
      capabilities: [image_generation, video_generation, audio_processing, video_post]
    expected:
      route: golden-key-subject-ip
      episode_role: recognition
      narrative_driver: character_performance
      presenter_mode: none
      visual_backbone: approved_character_assets
      use: [reference_analysis, differentiated_concepts, sample_subcheckpoint]
      do_not_use: [carbon_copy, batch_before_sample]
      blocker_if_missing: [approved_sample]
