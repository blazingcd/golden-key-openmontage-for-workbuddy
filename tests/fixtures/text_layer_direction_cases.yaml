version: "1.0"
cases:
  - id: ordinary-narration-active-word
    edit_decisions:
      render_runtime: remotion
      subtitles:
        enabled: true
        source: asset-caption-words
        style: word-by-word
        max_chars_per_line: 15
      overlays: []
      metadata:
        text_layer_direction:
          layers:
            - layer_id: primary-caption
              role: continuous_caption
              delivery: subtitles
              renderer: subtitle_gen_remotion
              reason: Carries the complete narration; active color only marks reading progress.
    expected_valid: true

  - id: four-character-large-emphasis
    edit_decisions:
      render_runtime: hyperframes
      subtitles:
        enabled: false
      overlays:
        - asset_id: overlay-keyword-01
      metadata:
        text_layer_direction:
          layers:
            - layer_id: emotional-keyword
              role: expressive_emphasis
              delivery: overlay
              renderer: hyperframes_component
              asset_ids: [overlay-keyword-01]
              reason: Four-character display phrase carries the emotional turn.
    expected_valid: true

  - id: mixed-caption-and-emphasis
    edit_decisions:
      render_runtime: remotion
      subtitles:
        enabled: true
        source: asset-caption-words
        style: word-by-word
      overlays:
        - asset_id: overlay-memory-word
      metadata:
        text_layer_direction:
          layers:
            - layer_id: primary-caption
              role: continuous_caption
              delivery: subtitles
              renderer: subtitle_gen_remotion
              reason: Carries the full narration.
            - layer_id: memory-emphasis
              role: expressive_emphasis
              delivery: overlay
              renderer: remotion_overlay
              asset_ids: [overlay-memory-word]
              reason: One short phrase marks the final recognition beat.
          attention_policy: Show the emphasis only after the ordinary caption clears.
    expected_valid: true

  - id: invalid-large-text-forced-into-subtitles
    edit_decisions:
      render_runtime: remotion
      subtitles:
        enabled: true
        source: asset-keyword
        style: word-by-word
      overlays: []
      metadata:
        text_layer_direction:
          layers:
            - layer_id: oversized-keyword
              role: expressive_emphasis
              delivery: subtitles
              renderer: subtitle_gen_remotion
              reason: Incorrectly treats emphasis as ordinary captions.
    expected_valid: false
    expected_issue: expressive_emphasis must use overlay delivery

  - id: invalid-remotion-caption-on-ffmpeg-runtime
    edit_decisions:
      render_runtime: ffmpeg
      subtitles:
        enabled: true
        source: asset-caption-words
        style: word-by-word
      overlays: []
      metadata:
        text_layer_direction:
          layers:
            - layer_id: primary-caption
              role: continuous_caption
              delivery: subtitles
              renderer: subtitle_gen_remotion
              reason: Runtime contradicts the selected active-word renderer.
    expected_valid: false
    expected_issue: requires render_runtime=remotion

  - id: invalid-mixed-without-attention-policy
    edit_decisions:
      render_runtime: remotion
      subtitles:
        enabled: true
        source: asset-caption-words
        style: word-by-word
      overlays:
        - asset_id: overlay-cta
      metadata:
        text_layer_direction:
          layers:
            - layer_id: primary-caption
              role: continuous_caption
              delivery: subtitles
              renderer: subtitle_gen_remotion
              reason: Carries the full narration.
            - layer_id: final-cta
              role: cta
              delivery: overlay
              renderer: remotion_overlay
              asset_ids: [overlay-cta]
              reason: Requests the approved follow action.
    expected_valid: false
    expected_issue: require an attention_policy

  - id: invalid-unbound-overlay-asset
    edit_decisions:
      render_runtime: hyperframes
      subtitles:
        enabled: false
      overlays: []
      metadata:
        text_layer_direction:
          layers:
            - layer_id: section-title
              role: title_or_section
              delivery: overlay
              renderer: hyperframes_component
              asset_ids: [missing-title-asset]
              reason: Introduces the next chapter.
    expected_valid: false
    expected_issue: overlay assets are not present
